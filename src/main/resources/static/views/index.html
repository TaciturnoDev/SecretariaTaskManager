<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title> SIGD - SDE</title>
	<!--   Sistema Integrado de Gestão de Demandas -->

    <!-- ================= CSS ================= -->
    <link rel="stylesheet" href="/css/style.css">

    <!-- Ícones -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body>

<!-- ===================================================== -->
<!--  BANNER / TOPO -->
<!-- ===================================================== -->

<div class="banner">

    <img
        src="/imagens/desenvolvimento_economico.png"
        alt="Logo"
    >

    <div class="user-container">

        <div class="notification-container">

            <button
                id="notificationButton"
                class="notification-button"
                onclick="toggleNotifications()"
                title="Notificações"
            >
                🔔

                <span
                    id="notificationBadge"
                    class="notification-badge"
                    style="display: none;"
                >
                    0
                </span>
            </button>

            <div
                id="notificationPanel"
                class="notification-panel"
                style="display: none;"
            >

                <div class="notification-header">

                    <strong>Notificações</strong>

                    <button
                        type="button"
                        class="notification-close"
                        onclick="closeNotifications()"
                        title="Fechar"
                    >
                        ✖
                    </button>

                </div>

                <div id="notificationList">

                    <div class="notification-empty">
                        Carregando...
                    </div>

                </div>

            </div>

        </div>

        <span
            id="loggedUserName"
            class="logged-user-name"
        ></span>

        <div
            class="user-icon"
            id="userIcon"
        >
            👤
        </div>

        <button onclick="logout()">Sair</button>

    </div>

</div>

<!-- ===================================================== -->
<!--  SIDEBAR -->
<!-- ===================================================== -->
<div id="sidebar" class="sidebar">

	<div class="sidebar-toggle" onclick="toggleSidebar()">
	    ☰
	</div>
	
    <div class="sidebar-top">
        <h2>Menu</h2>
    </div>

	<ul class="sidebar-menu">

	    <li>
	        <a href="/views/index.html" class="menu-link active">
	            <i>📋</i>
	            <span>Tarefas</span>
	        </a>
	    </li>

	    <li>
	        <a href="/views/setores.html" class="menu-link">
	            <i>🏢</i>
	            <span>Setores</span>
	        </a>
	    </li>

	    <li>
	        <a href="#" class="menu-link">
	            <i>📅</i>
	            <span>Eventos</span>
	        </a>
	    </li>

	    <li>
	        <a href="#" class="menu-link">
	            <i>📊</i>
	            <span>Dashboard</span>
	        </a>
	    </li>

	    <li>
	        <a href="/views/admin.html" class="menu-link">
	            <i>🛡️</i>
	            <span>Super Admin</span>
	        </a>
	    </li>

	</ul>

</div>

<!-- ===================================================== -->
<!--  CONTEÚDO -->
<!-- ===================================================== -->
<div class="page-container">

    <main class="content">

        <div class="form-card">
            <h2>Nova Demanda</h2>

            <input id="title" placeholder="Título">
			<textarea
			    id="description"
			    placeholder="Descrição"
			    maxlength="1000"
				rows="1"
			></textarea>

            <select id="status">
                <option value="PENDING">Pendente</option>
                <option value="IN_PROGRESS">Em andamento</option>
                <option value="COMPLETED">Concluída</option>
            </select>

			
			<!-- ================= PRIORIDADE ================= -->
			  <select id="priority">
			     <option value="LOW">Pequena</option>
	             <option value="MEDIUM" selected>Média</option>
			     <option value="HIGH">Alta</option>
				 <option value="URGENT">Urgente</option>
               </select>
								  
								  
            <button id="submitBtn" onclick="createTask()">Criar</button>
        </div>


        <div class="task-filters">

            <input
                type="text"
                id="searchInput"
                placeholder="Buscar por nome, descrição ou CPF"
                oninput="aplicarFiltros()"
            >

            <select id="filterStatus" onchange="aplicarFiltros()">
                <option value="ALL">Todos</option>
                <option value="PENDING">Pendente</option>
                <option value="IN_PROGRESS">Em andamento</option>
                <option value="COMPLETED">Concluída</option>
            </select>

            <select id="sectorSelect" onchange="aplicarFiltros()" style="display:none;">
                <option value="ALL">Todos os setores</option>
            </select>
			
			<select id="taskSectorSelect" style="display:none;">
				<option value="">Selecione o setor</option>
			</select>

        </div>

		
		
        <select id="filterUser" onchange="aplicarFiltros()">
            <option value="ALL">Todos os usuários</option>
        </select>
		
	

        <div id="loading" class="loading" style="display:none;">
            Carregando tarefas...
        </div>

        <div class="dashboard">
            <div>Total: <span id="totalTasks"></span></div>
            <div>Pendentes: <span id="pendingTasks"></span></div>
            <div>Em andamento: <span id="progressTasks"></span></div>
            <div>Concluídas: <span id="doneTasks"></span></div>
        </div>

		
		<!-- ============ TAREFAS =================-->
        <div class="tasks-header">
            <h2>Demandas</h2>
            <div id="paginationTop" class="pagination inline"></div>
        </div>

        <ul id="taskList"></ul>

        <div id="paginationBottom" class="pagination"></div>

    </main>

</div>

<!-- ================= MODAL TAREFA ================= -->

<div id="taskModalOverlay">

    <div id="taskModal">

        <button id="closeTaskModalBtn">
            ✖
        </button>

        <div id="taskModalContent">

        </div>

    </div>

</div>


<!-- ================= MODAL DE DELEGAÇÃO ================= -->

<div
    id="delegateModalOverlay"
    class="modal-overlay"
    style="display:none;"
>

    <div class="modal-content delegate-modal">
		
		    <div class="delegate-task-title">
				<strong>Tarefa:</strong>
				<span id="delegateTaskTitle">-</span>
			</div>

        <h2>Delegar tarefa</h2>

        <hr>

        <div class="modal-section">

            <span>Responsável atual</span>

            <strong id="delegateCurrentResponsible">
                -
            </strong>

        </div>

        <hr>

        <div class="modal-section">

            <label for="delegateUserSelect">
                Novo responsável
            </label>

            <select id="delegateUserSelect">

                <option value="">
                    Carregando usuários...
                </option>

            </select>

        </div>

        <hr>

        <div class="modal-section">

            <label for="delegateComment">
                Comentário (opcional)
            </label>

            <textarea
                id="delegateComment"
                rows="4"
                placeholder="Ex.: Encaminhando para continuidade da atividade."
            ></textarea>

        </div>

        <hr>

        <div class="modal-actions">

            <button
                id="cancelDelegateBtn"
                onclick="closeDelegateModal()"
            >
                Cancelar
            </button>

            <button
                id="confirmDelegateBtn"
				onclick="confirmDelegate()"
            >
                Delegar tarefa
            </button>

        </div>

    </div>

</div>

<!-- ===================================================== -->
<!-- JS -->
<!-- ===================================================== -->
<script src="/js/app.js"></script>


</body>
</html>
